<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEEE TRSYP Links</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome for Brand Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Orbitron:wght@800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-blue: #2271B6; 
      --secondary-green: #23B5A8; 
      --text-light: #f8f9fa;
      --instagram-glow: rgba(228, 64, 95, 0.7); 
      --facebook-glow: rgba(24, 119, 242, 0.7); 
      --linkedin-glow: rgba(10, 102, 194, 0.7);
    }
    body {
      font-family: 'Montserrat', sans-serif; 
      color: var(--text-light);
      background-image: url('https://i.postimg.cc/svrM31LN/t-01.png'); 
      background-size: cover; 
      background-position: center center; 
      background-attachment: fixed; 
      padding: 1rem;
    }
    .main-container { 
      min-height: calc(100vh - 2rem); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .glass-card {
      background: rgba(10, 10, 20, 0.8); 
      backdrop-filter: blur(15px) saturate(180%); 
      -webkit-backdrop-filter: blur(15px) saturate(180%);
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.125); 
      padding: 2.5rem 1.5rem;
      max-width: 600px; 
      width: 100%; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .profile-img { 
      width: 140px; 
      height: 140px; 
      border-radius: 50%; 
      border: 4px solid var(--primary-blue); 
      margin-top: -95px; 
      margin-bottom: 1rem; 
      background-color: #000; 
    }
    .profile-title { 
      font-family: 'Orbitron', sans-serif; 
      font-weight: 800; 
      font-size: clamp(2.5rem, 8vw, 3rem); 
      color: var(--text-light); 
      text-shadow: 0 0 15px rgba(34, 113, 182, 0.5); 
    }
    .profile-description { 
      font-size: 1rem; 
      color: #ced4da; 
      margin-bottom: 2rem; 
      max-width: 450px; 
      margin-left: auto; 
      margin-right: auto; 
    }
    
    .social-icons { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 1.5rem; 
    }
    .social-icons a {
      display: flex; 
      align-items: center; 
      justify-content: center;
      width: 56px; 
      height: 56px;
      border-radius: 50%;
      transition: all 0.3s ease-in-out;
      font-size: 28px;
      text-decoration: none;
    }
    .social-icons a:hover { transform: translateY(-5px); }

    .icon-instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      color: white;
    }
    .icon-facebook {
      background-color: #1877F2; 
      color: white;
    }
    .icon-linkedin {
      background-color: #0A66C2; 
      color: white;
    }

    .icon-instagram:hover { box-shadow: 0 0 20px 5px var(--instagram-glow); }
    .icon-facebook:hover { box-shadow: 0 0 20px 5px var(--facebook-glow); }
    .icon-linkedin:hover { box-shadow: 0 0 20px 5px var(--linkedin-glow); }

    .link-btn { 
      background: transparent; 
      border: 2px solid var(--primary-blue); 
      color: var(--text-light); 
      font-weight: 600; 
      font-size: 1.1rem; 
      padding: 1rem; 
      transition: all 0.3s ease; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .link-btn:hover { 
      background: var(--primary-blue); 
      border-color: var(--secondary-green); 
      color: var(--text-light); 
      transform: scale(1.05); 
    }
    .footer-text { 
      font-size: 0.8rem; 
      color: #6c757d; 
      margin-top: 2rem; 
      padding-bottom: 0; 
    }
  </style>
</head>
<body>
  <div class="container main-container">
    <div class="glass-card text-center">
      <img src="https://i.postimg.cc/DShLpxFm/PDP-Final-4x.png" alt="TRSYP Logo" class="profile-img">
      <h1 class="profile-title">TRSYP</h1>
      <p class="profile-description">An annual event that gathers IEEE RAS Tunisia Section members, organized by the IEEE ENET’Com Student Branch and IEEE RAS ENET’Com Student Branch Chapter.</p>
      
      <!-- Small Circular Icons Section -->
      <div class="social-icons mb-4">
        <a href="https://www.instagram.com/ieee_trsyp" target="_blank" title="Instagram" class="icon-instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com/share/1GCPaKanBz/" target="_blank" title="Facebook" class="icon-facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.linkedin.com/company/ieee-ras-tunisia-section/" target="_blank" title="LinkedIn" class="icon-linkedin">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
      
      <!-- Main Link Buttons Section -->
      <div class="d-grid gap-3 mt-4">
        <a href="https://rtc.ieee.tn" class="btn link-btn" target="_blank">Official Website</a>
        
        <!-- *** SPONSORING DOSSIER BUTTON ADDED BACK *** -->
        <a href="https://drive.google.com/file/d/1ibzMJqappOLsiiiK4i_zU252Mmof-idq/view?usp=sharing" class="btn link-btn" target="_blank">Sponsoring Dossier</a>
        
        <a href="https://www.instagram.com/ieee_trsyp" class="btn link-btn" target="_blank">
            <i class="fab fa-instagram me-2"></i> Instagram
        </a>
        <a href="https://www.facebook.com/share/1GCPaKanBz/" class="btn link-btn" target="_blank">
            <i class="fab fa-facebook-f me-2"></i> Facebook
        </a>
        <a href="https://www.linkedin.com/company/ieee-ras-tunisia-section/" class="btn link-btn" target="_blank">
            <i class="fab fa-linkedin-in me-2"></i> LinkedIn
        </a>
      </div>
      
      <p class="footer-text">© 2025 IEEE TRSYP. All Rights Reserved.</p>
    </div>
  </div>
</body>
</html>
